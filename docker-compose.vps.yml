# PharmaSuite API — VPS stack (Docker Compose)
#
# Deployed at /opt/pharmasuite on the shared Contabo VPS.
#
# Database: the HOST's PostgreSQL (same server as ruletheday-backend, own
#   database) — reached from the container via host.docker.internal.
# Cache:    the bundled redis container below.
# Routing:  the outer ruletheday nginx (:80/:443) routes
#   api-pharmasuite.ruletheday.app to the web container over the shared
#   ruletheday-backend_default network — see deploy/vps/ruletheday-snippet.conf
#   and docs/deployment-vps.md.
#
#   docker compose -f docker-compose.vps.yml up -d --build

name: pharmasuite

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmasuite-web
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the host's PostgreSQL
    ports:
      - "127.0.0.1:8013:8000"   # loopback only, for internal debugging
    volumes:
      - media_files:/app/media  # attachment uploads survive rebuilds
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - shared
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pharmasuite-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  default:
  shared:
    external: true
    name: ruletheday-backend_default

volumes:
  media_files:
