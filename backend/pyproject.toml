[project]
name = "erp-backend"
version = "0.1.0"
description = "Medicine Dealer ERP backend"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.4",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "django-filter>=24.3",
    "drf-spectacular>=0.27",
    "django-cors-headers>=4.6",
    "argon2-cffi>=23.1",
    "celery>=5.4",
    "redis>=5.2",
    "gunicorn>=23.0",
    "pyotp>=2.10.0",
    "reportlab>=5.0.1",
    "sentry-sdk[django]>=2.71.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "coverage>=7.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
