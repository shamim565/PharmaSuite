x-app-environment: &app-environment
  SECRET_KEY: dev-insecure-change-me
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1,web
  DATABASE_URL: postgres://erp:erp_dev_password@postgres:5432/erp_dev
  REDIS_URL: redis://redis:6379/0
  CACHE_URL: redis://redis:6379/6
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  OWNER_MOBILE: "01700000000"
  OWNER_PASSWORD: Admin@1234

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: erp_dev
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_password
    ports:
      - "5433:5432"
    volumes:
      - erp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../backend
    environment: *app-environment
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py seed_rbac &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "uv run python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    command: >
      sh -c "[ -f node_modules/.package-lock.json ] || npm ci;
             npm run dev -- -H 0.0.0.0"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      web:
        condition: service_started

  worker:
    build:
      context: ../backend
    environment: *app-environment
    command: uv run celery -A config worker -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ../backend
    environment: *app-environment
    command: uv run celery -A config beat -l info
    depends_on:
      redis:
        condition: service_healthy

volumes:
  erp_pg_data:
  frontend_node_modules:
