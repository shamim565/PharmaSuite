x-app-environment: &app-environment
  SECRET_KEY: dev-insecure-change-me
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1,web
  DATABASE_URL: postgres://erp:erp_dev_password@postgres:5432/erp_dev
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  OWNER_MOBILE: "01700000000"
  OWNER_PASSWORD: Admin@1234

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: erp_dev
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_dev_password
    ports:
      - "5433:5432"
    volumes:
      - erp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../backend
    environment: *app-environment
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run python manage.py seed_rbac &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../backend
    environment: *app-environment
    command: uv run celery -A config worker -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ../backend
    environment: *app-environment
    command: uv run celery -A config beat -l info
    depends_on:
      redis:
        condition: service_healthy

volumes:
  erp_pg_data:
