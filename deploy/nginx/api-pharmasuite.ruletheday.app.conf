# PharmaSuite API — api-pharmasuite.ruletheday.app
#
# Install:
#   sudo cp deploy/nginx/api-pharmasuite.ruletheday.app.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api-pharmasuite.ruletheday.app.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api-pharmasuite.ruletheday.app
#
# certbot will add the TLS server block and the http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name api-pharmasuite.ruletheday.app;

    # Attachments upload/download through the Django API (permission-checked),
    # so /media is intentionally NOT served directly by nginx.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65;
        proxy_connect_timeout 5;
    }
}
